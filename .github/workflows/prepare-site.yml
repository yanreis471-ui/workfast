name: Preparar site Work Fast para GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'WORKFAST_SITE_ATUALIZADO.zip'
      - '.github/workflows/prepare-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    name: Extrair e publicar arquivos do site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extrair pacote do site
        shell: bash
        run: |
          set -euo pipefail
          test -f WORKFAST_SITE_ATUALIZADO.zip
          mkdir -p /tmp/workfast-web
          unzip -oq WORKFAST_SITE_ATUALIZADO.zip -d /tmp/workfast-web
          test -f /tmp/workfast-web/WORKFAST/index.html
          cp -a /tmp/workfast-web/WORKFAST/. ./
          touch .nojekyll
          test -f index.html
          test -f styles.css
          test -f js/config.js
          test -f assets/workfast-bg.mp4

      - name: Salvar arquivos no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css js/ assets/ .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publicar site da Work Fast para GitHub Pages"
            git push
          else
            echo "Site já atualizado."
          fi
